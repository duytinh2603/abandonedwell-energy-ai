<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AbandonedWell Energy AI</title>
  <meta name="description" content="Sàng lọc giếng dầu khí ngừng khai thác để chuyển đổi sang địa nhiệt / Screening abandoned oil & gas wells for geothermal repurposing.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231565c0'/%3E%3Crect x='13' y='6' width='6' height='20' fill='%23cfe3f5'/%3E%3Cpath d='M16 24V9' stroke='%23ef5350' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <!-- ribbon -->
  <header class="ribbon">
    <div class="tabbar">
      <div class="tabs" id="ribbonTabs"></div>
      <div class="tabbar-right">
        <span class="proj-name" id="projName"></span>
        <div class="lang" role="group" aria-label="Language"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div>
      </div>
    </div>
    <div class="ribbon-body" id="ribbonBody"></div>
  </header>

  <!-- main -->
  <div class="main">
    <aside class="side" id="side">
      <section class="pane" id="paneBrowser">
        <div class="pane-head"><div class="pane-tab"><span class="pi" data-icon="browser"></span><span data-i18n="p.browser"></span><button class="x" data-close="paneBrowser">×</button></div></div>
        <div class="pane-tools">
          <button data-act="importLas" data-icon="importLas" data-tip="b.importLas"></button>
          <button data-act="newWell" data-icon="addSmall" data-tip="b.newWell"></button>
          <button data-act="toggleTree" data-icon="collapse" data-tip=""></button>
          <button data-act="delete" data-icon="del" data-tip="b.delete"></button>
          <button data-act="focusProps" data-icon="edit" data-tip="b.props"></button>
          <select id="famFilter" title="Family"></select>
          <button data-act="search" data-icon="search" data-tip=""></button>
          <span class="filter-label"><span data-i18n="filter"></span>: <b id="filterLabel"></b></span>
          <button class="clear-filter" data-act="clearFilter" title="×">✕</button>
        </div>
        <input class="tree-search" id="treeSearch" hidden>
        <div class="tree-head"><span data-i18n="col.name"></span><span data-i18n="col.family"></span><span data-i18n="col.unit"></span></div>
        <div class="tree" id="tree"></div>
      </section>
      <div class="hsplit" data-split="paneBrowser"></div>
      <section class="pane" id="paneProps">
        <div class="pane-head"><div class="pane-tab"><span class="pi" data-icon="props"></span><span data-i18n="p.props"></span><button class="x" data-close="paneProps">×</button></div></div>
        <div class="props" id="props"></div>
      </section>
      <div class="hsplit" data-split="paneProps"></div>
      <section class="pane" id="paneOutput">
        <div class="pane-head"><div class="pane-tab"><span class="pi" data-icon="output"></span><span data-i18n="p.output"></span><button class="x" data-close="paneOutput">×</button></div>
          <button class="pane-btn" data-act="clearLog" title="Clear">⟲</button></div>
        <div class="out-search"><span>⌕</span><input id="logSearch"></div>
        <div class="output" id="output"></div>
      </section>
    </aside>
    <div class="vsplit" id="vsplit"></div>
    <section class="work">
      <div class="doc-tabs" id="docTabs"></div>
      <div class="doc-area" id="docArea"></div>
    </section>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="modal-box"><div class="modal-head"><h3 id="mTitle"></h3><button class="x" id="mX">×</button></div><div class="modal-body" id="mBody"></div><div class="modal-foot" id="mFoot"></div></div></div>
<input type="file" id="fileLas" accept=".las,.LAS" multiple hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv" hidden>
<input type="file" id="fileProj" accept=".json,application/json" hidden>
<input type="file" id="fileSurvey" accept=".txt,.csv,.dev,.sur" hidden>
<input type="file" id="fileDst" accept=".csv,text/csv" hidden>

<script src="js/vendor/chart.umd.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/model.js"></script>
<script src="js/las.js"></script>
<script src="js/utilization.js"></script>
<script src="js/tech.js"></script>
<script src="js/ml.js"></script>
<script src="js/guide.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
